android.useAndroidX=true
android.enableJetifier=true

# JVM Memory Configuration (Java 17 compatible)
org.gradle.jvmargs=-Xmx2048m -XX:MetaspaceSize=512m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/

# Build Optimization Flags
android.enableR8.fullMode=false
android.dexOptions.incremental=true
android.useDeprecatedNdk=false
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true

# Compose Compiler Optimization
kotlin.compiler.nowarn=true
