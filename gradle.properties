android.useAndroidX=true
android.enableJetifier=true

# JVM Memory Configuration
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/

# Build Optimization Flags
android.enableR8.fullMode=false
android.dexOptions.incremental=true
android.useDeprecatedNdk=false
org.gradle.parallel=true
org.gradle.workers.max=4

# Compose Compiler Optimization
kotlin.compiler.nowarn=true
